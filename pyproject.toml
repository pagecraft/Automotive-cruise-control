[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-aware-cruise-control"
version = "1.0.0"
description = "Reproducible energy-aware highway cruise control with grade-preview uncertainty"
requires-python = ">=3.10"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
energy-cruise = "energy_cruise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
